name: Aside
options:
  bundleIdPrefix: com.rigomart
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
# Verify builds the app for UI tests under its own bundle ID, name and URL scheme, so it runs
# beside the owner's copy without sharing defaults, privacy grants or `aside://`.
configs:
  Debug: debug
  Release: release
  Verify: debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: WHZ7FDCNMT
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: NO
packages:
  AsideCore:
    path: Packages/AsideCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
targets:
  Aside:
    type: application
    platform: macOS
    sources: [App/Sources]
    dependencies:
      - package: AsideCore
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(ASIDE_DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.rigomart.aside
            CFBundleURLSchemes: [$(ASIDE_URL_SCHEME)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rigomart.aside
        ASIDE_DISPLAY_NAME: Aside
        ASIDE_URL_SCHEME: aside
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        Verify:
          PRODUCT_BUNDLE_IDENTIFIER: com.rigomart.aside.verify
          ASIDE_DISPLAY_NAME: Aside Verify
          ASIDE_URL_SCHEME: aside-verify
  AsideUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        excludes: ["**/.gitkeep"]
    dependencies:
      - target: Aside
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rigomart.aside.uitests
        TEST_TARGET_NAME: Aside
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Aside:
    build:
      targets:
        Aside: all
    run:
      config: Debug
    archive:
      config: Release
  # UI tests take over the screen, so they have their own scheme and never run from `make check`.
  # Run them through `scripts/verify run`.
  AsideUITests:
    build:
      targets:
        AsideUITests: [test]
    test:
      config: Verify
      targets: [AsideUITests]
